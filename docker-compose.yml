services:
  mysql:
    image: mysql:8.0
    container_name: paperrag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-paperrag}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: paperrag-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-paperrag}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-paperrag}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-graph-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      GRAPH_RAG_ENABLED: ${GRAPH_RAG_ENABLED:-false}
      GRAPH_SEED_PAPERS: ${GRAPH_SEED_PAPERS:-4}
      GRAPH_MAX_HOPS: ${GRAPH_MAX_HOPS:-2}
      GRAPH_CANDIDATE_LIMIT: ${GRAPH_CANDIDATE_LIMIT:-12}
      GRAPH_QUERY_TIMEOUT_MS: ${GRAPH_QUERY_TIMEOUT_MS:-800}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-MiniMax-M2.7}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.minimax.chat/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      RETRIEVAL_K: ${RETRIEVAL_K:-12}
      HYBRID_ALPHA: ${HYBRID_ALPHA:-0.72}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: paperrag-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: paperrag-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && IFS= read -r status <&3 && [[ \"$${status}\" == *\"200\"* ]]"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: paperrag-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local-graph-password}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-graph-password}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$NEO4J_PASSWORD\" 'RETURN 1;' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  qdrant_data:
  neo4j_data:
